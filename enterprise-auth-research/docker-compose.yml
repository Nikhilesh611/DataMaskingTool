services:
  # ── OpenLDAP ──────────────────────────────────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0
    container_name: lab-openldap
    environment:
      LDAP_ORGANISATION: "Lab Corp"
      LDAP_DOMAIN: "lab.local"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_CONFIG_PASSWORD: "configpassword"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonlypassword"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./infrastructure/ldap-seed:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service
    networks:
      - labnet

  # ── Keycloak ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: lab-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    command: start-dev
    depends_on:
      - openldap
    networks:
      - labnet

  # ── HashiCorp Vault ───────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: lab-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    depends_on:
      - openldap
      - keycloak
    networks:
      - labnet

volumes:
  openldap_data:
  openldap_config:

networks:
  labnet:
    driver: bridge
